name: instagram daily

# One piece a day at 04:44 KST (19:44 UTC the day before). The script reads the
# account's own feed to decide what is next, so a skipped or retried run cannot
# double-post, and when every hosted piece has been published it exits quietly —
# the series stops until a new batch is sampled, rendered, and uploaded.
on:
  schedule:
    - cron: "44 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post = publish the next piece · dry-run = validate only · refresh = rotate the token now"
        type: choice
        options: [post, dry-run, refresh]
        default: dry-run

concurrency:
  group: instagram-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the next piece
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_DATE: ${{ secrets.IG_TOKEN_DATE }}
          # gh reads the release inventory with the run's own token; the PAT (with
          # this repository's Secrets: read/write) takes over when present so a
          # refreshed token can be stored — that is what makes the 60-day expiry
          # a non-event. Posting works either way until the first refresh is due.
          GH_TOKEN: ${{ secrets.IG_SECRETS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          case "${{ inputs.mode || 'post' }}" in
            refresh)  python scripts/post_instagram.py --refresh ;;
            dry-run)  python scripts/post_instagram.py --auto --dry-run ;;
            *)        python scripts/post_instagram.py --auto ;;
          esac
